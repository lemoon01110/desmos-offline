<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:">
<title>Desmos Offline</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="left">
    <button id="menuBtn" class="icon" title="Open Graph (Ctrl+O)" aria-label="Open graph">
      <svg viewBox="0 0 24 24"><path d="M3 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13.2a1.5 1.5 0 0 0 1.4-1l2.4-6.5a1 1 0 0 0-.9-1.4H7.4a1.5 1.5 0 0 0-1.4 1L3.4 18.4M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h6A1.5 1.5 0 0 1 18 9.5v1"/></svg>
    </button>
    <span class="divider"></span>
    <input id="title" spellcheck="false" value="Untitled Graph" aria-label="Graph title" title="Click to rename">
    <button id="saveBtn" class="save" disabled title="Save (Ctrl+S)">Save</button>
  </div>
  <div class="dropdown center">
    <button id="kindBtn" class="kind" title="Switch calculator">Graphing <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
    <div id="kindMenu" class="menu" hidden></div>
  </div>
  <div class="right">
    <span id="status"></span>
    <div class="dropdown">
      <button id="exportBtn" class="icon" title="Export image (Ctrl+Shift+E)" aria-label="Export image">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>
      </button>
      <div id="exportMenu" class="menu" hidden>
        <button data-export="png">Download picture (PNG)</button>
        <button data-export="png-hi">Download picture, high resolution</button>
        <button data-export="svg">Download vector (SVG)</button>
        <button data-export="clip">Copy picture to clipboard</button>
      </div>
    </div>
    <button id="newBtn" class="icon" title="New Blank Graph (Ctrl+N)" aria-label="New blank graph">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="themeBtn" class="icon" title="Dark mode (Ctrl+Shift+D)" aria-label="Dark mode">
      <svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.2 6.2 0 0 0 9.5 9.5z"/></svg>
    </button>
  </div>
</header>

<aside id="drawer" hidden>
  <div class="drawer-head">
    <input id="search" placeholder="Search your graphs" spellcheck="false">
  </div>
  <div class="drawer-actions">
    <button id="dNew">New graph</button>
    <button id="dImportFile">Open file…</button>
    <button id="dImportLink">Paste desmos.com link…</button>
    <button id="dFolder">Show folder</button>
  </div>
  <ul id="graphList"></ul>
</aside>
<div id="scrim" hidden></div>

<div id="linkBox" class="modal" hidden>
  <div class="card">
    <h2>Bring in a desmos.com graph</h2>
    <p>Paste a link like desmos.com/calculator/abc123. This one step needs internet; the copy is saved here and works offline after.</p>
    <input id="linkInput" placeholder="https://www.desmos.com/calculator/…" spellcheck="false">
    <p id="linkErr" class="err"></p>
    <div class="row"><button id="linkCancel">Cancel</button><button id="linkGo" class="primary">Bring it in</button></div>
  </div>
</div>

<main id="calc"></main>
<div id="toast" hidden></div>

<script src="vendor/calculator.js"></script>
<script src="app.js"></script>
</body>
</html>
